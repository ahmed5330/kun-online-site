name: VPS-free blog publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-blog-publisher.yml'
      - 'content/approved/**'
  schedule:
    - cron: '17 9 * * *'
      timezone: 'Africa/Cairo'
    # GitHub scheduled runs can be delayed or skipped during heavy load.
    # The Cairo-date publication lock prevents duplicates on fallback runs.
    - cron: '37 15 * * *'
      timezone: 'Africa/Cairo'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview eligible approved articles without publishing'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: kun-online-daily-blog-publication
  cancel-in-progress: false

jobs:
  approved-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main, not an expired VPS
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest main to avoid stale publisher state
        run: git pull --ff-only origin main
      - name: Respect approval and one-publication-per-Cairo-day lock
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'check' || 'publish' }}
        run: node scripts/publish-approved-article.mjs --"$MODE"
      - name: Refresh blog HTML cards and sitemap
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: python scripts/refresh_site.py
      - name: Validate content plan, links and SEO
        run: npm test
      - name: Commit at most one approved and tested article
        id: publish
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          set -euo pipefail
          git add blog/ seo-content-map.json seo/keyword-map.json seo/published-series-mapping.json sitemap.xml content/publication-log.json
          if git diff --cached --quiet; then
            echo 'Nothing approved and eligible today; no publication.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'blog: publish one pre-approved article (Cairo date guard)'
          git push origin HEAD:main
          echo 'published=true' >> "$GITHUB_OUTPUT"
          echo 'Published to main. Explicitly dispatching QA workflows because GITHUB_TOKEN pushes do not trigger push workflows.'
      - name: Explicitly dispatch post-publication QA and live audit
        if: ${{ steps.publish.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in site-quality.yml live-cloudflare-audit.yml; do
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"ref":"main"}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches"
            echo "Dispatched $workflow on main"
          done

      - name: Surface failed publication as a GitHub issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Blog publishing pipeline failure"
          count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq 'length' || echo 0)
          if [ "$count" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The blog publisher failed. Review run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No successful new publication should be claimed until the public URL and sitemap are verified." || true
          fi
      - name: Warn if the approved editorial queue is exhausted
        if: ${{ success() && (github.event_name == 'schedule' || steps.publish.outputs.published == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          remaining=$(node -e "const fs=require('fs'); const log=JSON.parse(fs.readFileSync('content/publication-log.json','utf8')); const done=new Set(log.map(x=>x.slug)); const names=fs.readdirSync('content/approved').filter(x=>x.endsWith('.json')).map(x=>x.slice(0,-5)); console.log(names.filter(x=>!done.has(x)).length)")
          if [ "$remaining" = "0" ]; then
            echo "::warning::The approved queue is empty. The scheduler cannot write articles by itself."
            title="Blog editorial queue needs approved articles"
            count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq 'length' || echo 0)
            if [ "$count" = "0" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --body "All approved articles have been published. Add new reviewed HTML, metadata and cover to content/approved/. The daily scheduler does not generate new articles. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
            fi
          fi
