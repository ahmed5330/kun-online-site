name: Live Lighthouse mobile and desktop
on:
  pull_request:
    paths:
      - 'index.html'
      - '.github/workflows/lighthouse-baseline.yml'
      - 'scripts/lighthouse-summary.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-baseline.yml'
      - 'scripts/lighthouse-summary.mjs'
      - 'assets/**'
      - 'index.html'
      - 'services/**'
      - 'system/**'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kun-lighthouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Checkout main as comparable laboratory baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: main
          path: baseline-site
      - name: Configure matching test environments
        run: |
          mkdir -p test-results
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 -m http.server 8765 --directory . > /tmp/seo-current-server.log 2>&1 &
            python3 -m http.server 8766 --directory baseline-site > /tmp/seo-baseline-server.log 2>&1 &
            echo "AUDIT_URL=http://127.0.0.1:8765/" >> "$GITHUB_ENV"
            echo "BASELINE_URL=http://127.0.0.1:8766/" >> "$GITHUB_ENV"
          else
            echo "AUDIT_URL=https://kun-online.com/" >> "$GITHUB_ENV"
          fi
      - name: Check summary parser syntax and Chrome availability
        run: |
          node --check scripts/lighthouse-summary.mjs
          which google-chrome || which google-chrome-stable || which chromium
      # ABBA sequencing reduces the warm-run advantage previously given to main.
      # Both candidates are measured on the same localhost runner, never concurrently.
      - name: Mobile main baseline A1
        if: github.event_name == 'pull_request'
        run: |
          npx --yes lighthouse@12.8.2 "$BASELINE_URL" --only-categories=performance,seo --output=json --output-path=./test-results/lighthouse-baseline-mobile.json --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      - name: Mobile candidate B1
        run: |
          npx --yes lighthouse@12.8.2 "$AUDIT_URL" --only-categories=performance,seo --output=json --output-path=./test-results/lighthouse-mobile.json --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      - name: Mobile candidate B2
        if: github.event_name == 'pull_request'
        run: |
          npx --yes lighthouse@12.8.2 "$AUDIT_URL" --only-categories=performance,seo --output=json --output-path=./test-results/lighthouse-mobile-repeat.json --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      - name: Mobile main baseline A2
        if: github.event_name == 'pull_request'
        run: |
          npx --yes lighthouse@12.8.2 "$BASELINE_URL" --only-categories=performance,seo --output=json --output-path=./test-results/lighthouse-baseline-mobile-repeat.json --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      - name: Measure desktop
        run: |
          npx --yes lighthouse@12.8.2 "$AUDIT_URL" --preset=desktop --only-categories=performance,seo --output=json --output-path=./test-results/lighthouse-desktop.json --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      - name: Summarize laboratory metrics; distinguish field INP
        run: node scripts/lighthouse-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kun-online-lighthouse-baseline
          path: test-results/lighthouse-*.json
