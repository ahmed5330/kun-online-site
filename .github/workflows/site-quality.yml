name: Marketing site SEO and mobile QA
on:
  push:
    branches: [main, fix/seo-contact-20261013]
  pull_request:
  workflow_dispatch:
concurrency:
  group: marketing-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cover and optimized-image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --disable-pip-version-check Pillow==12.3.0 arabic-reshaper python-bidi
      - name: Generate transient approved covers before validating pending articles
        run: python scripts/generate-approved-covers.py
      - name: Build optimized images and refresh crawlable HTML
        run: python scripts/refresh_site.py --optimize-images
      - name: Syntax check live release auditor
        run: node --check scripts/live-site-audit.mjs
      - name: Show actual Cloudflare cache headers (diagnostic only)
        run: node scripts/cache-probe.mjs
      - name: Syntax check live analytics dry-run
        run: node --check scripts/live-ga4-network-audit.mjs
      - name: Static SEO and redirect checks
        run: |
          node --test tests/quality-no-direct-write.test.mjs
          npm test
      - name: Future publisher metadata regression
        run: python -m unittest discover -s tests -p '*_test.py'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser checks
        run: node scripts/browser-qa.mjs
      - name: PR Cloudflare preview GEO smoke (read only)
        if: github.event_name == 'pull_request' && (github.head_ref == 'feature/geo-readiness-20261027' || github.head_ref == 'fix/geo-pricing-current-main-20261027' || github.head_ref == 'feature/geo-editorial-answer-first-batch-20261028')
        env:
          GEO_PREVIEW_BASE: ${{ github.head_ref == 'feature/geo-editorial-answer-first-batch-20261028' && 'https://feature-geo-editorial-answer.kun-online-site.pages.dev' || (github.head_ref == 'fix/geo-pricing-current-main-20261027' && 'https://fix-geo-pricing-current-main.kun-online-site.pages.dev' || 'https://feature-geo-readiness-202610.kun-online-site.pages.dev') }}
          GEO_REQUIRE_20261028_EDITORIAL: ${{ github.head_ref == 'feature/geo-editorial-answer-first-batch-20261028' && '1' || '0' }}
        run: node scripts/geo-preview-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-site-browser-qa
          path: test-results/
      - name: Prepare optimized assets for a separately reviewed change
        run: |
          set -euo pipefail
          git add blog/images/*.webp blog/*.html sitemap.xml
          if ! git diff --cached --quiet; then
            node scripts/seo-geo-general-reviewer.mjs --staged --role publisher
            git diff --cached --binary > test-results/optimized-assets.patch
            echo "Optimized assets need a reviewed PR; this job does not push changes." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-assets-review-patch
          path: test-results/optimized-assets.patch
          if-no-files-found: ignore
