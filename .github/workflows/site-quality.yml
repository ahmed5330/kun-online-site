name: Marketing site SEO and mobile QA
on:
  push:
    branches: [main, fix/seo-contact-20261013]
  pull_request:
  workflow_dispatch:
concurrency:
  group: marketing-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cover and optimized-image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --disable-pip-version-check Pillow==12.3.0 arabic-reshaper python-bidi
      - name: Generate transient approved covers before validating pending articles
        run: python scripts/generate-approved-covers.py
      - name: Build optimized images and refresh crawlable HTML
        run: python scripts/refresh_site.py --optimize-images
      - name: Syntax check live release auditor
        run: node --check scripts/live-site-audit.mjs
      - name: Show actual Cloudflare cache headers (diagnostic only)
        run: node scripts/cache-probe.mjs
      - name: Syntax check live analytics dry-run
        run: node --check scripts/live-ga4-network-audit.mjs
      - name: Static SEO and redirect checks
        run: npm test
      - name: Future publisher metadata regression
        run: python -m unittest discover -s tests -p '*_test.py'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser checks
        run: node scripts/browser-qa.mjs
      - name: PR Cloudflare preview GEO smoke (read only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/geo-readiness-20261027'
        env:
          GEO_PREVIEW_BASE: https://feature-geo-readiness-202610.kun-online-site.pages.dev
        run: node scripts/geo-preview-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-site-browser-qa
          path: test-results/
      - name: Save verified optimized assets on the same authorized branch
        if: github.event_name == 'push'
        run: |
          git add blog/images/*.webp blog/*.html sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: optimize verified marketing images and static article links"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
