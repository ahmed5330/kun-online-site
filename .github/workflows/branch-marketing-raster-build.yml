name: Marketing raster QA branch-only
on:
  push:
    branches: [feature/editorial-hook-covers-20261103]
    paths:
      - '.github/workflows/branch-marketing-raster-build.yml'
      - 'blog/images/*.svg'
      - 'scripts/marketing-hook-cover-artwork.mjs'
      - 'seo/creative-hooks-20261103.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editorial-hook-covers-20261103
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core libcairo2
          python -m pip install 'Pillow>=11,<13' 'CairoSVG>=2.7,<3'
      - run: python scripts/render-approved-marketing-rasters.py --write
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-raster-32-preview
          path: blog/images/*.png
          retention-days: 7
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/images/*.png blog/images/*.webp
          git diff --cached --quiet || (git commit -m 'feat: generate 32 editorial raster variant sets' && git push origin HEAD:feature/editorial-hook-covers-20261103)
