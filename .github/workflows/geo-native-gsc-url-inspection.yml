name: GEO native GSC URL Inspection (read only)
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Number of source URLs to inspect'
        required: true
        default: priority
        type: choice
        options:
          - priority
          - all
permissions:
  contents: read
concurrency:
  group: geo-gsc-url-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
      GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
      GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify read-only OAuth settings are present
        run: |
          if [[ -z "$GSC_CLIENT_ID" || -z "$GSC_CLIENT_SECRET" || -z "$GSC_REFRESH_TOKEN" ]]; then
            echo "GSC read-only OAuth secrets are not configured. No inspection was run."
            exit 1
          fi
      - name: Exchange securely for short-lived read-only token and inspect URLs
        env:
          GEO_INSPECTION_SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 2 \
            -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$GSC_CLIENT_ID" \
            --data-urlencode "client_secret=$GSC_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GSC_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")
          access_token=$(node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).access_token||''))" <<< "$response")
          unset response
          if [[ -z "$access_token" ]]; then
            echo "OAuth token exchange returned no access token"
            exit 1
          fi
          echo "::add-mask::$access_token"
          if [[ "$GEO_INSPECTION_SCOPE" == "all" ]]; then
            GSC_ACCESS_TOKEN="$access_token" node scripts/geo-gsc-inspect.mjs --all
          else
            GSC_ACCESS_TOKEN="$access_token" node scripts/geo-gsc-inspect.mjs
          fi
          unset access_token
          node scripts/geo-evidence-scorecard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geo-native-gsc-inspection
          path: |
            test-results/geo-gsc-inspection.json
            test-results/geo-evidence-scorecard.json
          retention-days: 14
# Native URL Inspection reports indexed-version status. It does not submit pages to Google.
# Keep OAuth credentials in repository secrets, not user-visible issues, logs or sources.
